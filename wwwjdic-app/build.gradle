apply from: '../app.gradle'

android {
    buildFeatures {
        renderScript true
        aidl true
    }
    namespace 'org.nick.wwwjdic'
    lint {
        abortOnError false
        checkReleaseBuilds true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    //kotlinOptions {
    //    jvmTarget = '11'
    //}
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
